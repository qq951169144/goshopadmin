version: '3.8'

services:
  # MySQL服务
  mysql:
    image: mysql:8.0
    container_name: goshopadmin-mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=goshopadmin
      - MYSQL_USER=goshopadmin
      - MYSQL_PASSWORD=password
    networks:
      - goshopadmin-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis服务 - 使用Redis Stack包含RedisBloom模块
  redis:
    image: redis/redis-stack-server:7.2.0-v13
    container_name: goshopadmin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - goshopadmin-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ服务
  rabbitmq:
    image: rabbitmq:3.10-management
    container_name: goshopadmin-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_DEFAULT_VHOST=/
    networks:
      - goshopadmin-network
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 后端服务
  backend:
    image: golang:1.24-alpine
    container_name: goshopadmin-backend
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app  # 开发环境挂载本地代码
      - backend-logs:/app/logs  # 日志目录挂载，供 Filebeat 收集
    working_dir: /app
    environment:
      - GOPROXY=https://goproxy.cn,direct
    networks:
      - goshopadmin-network
    restart: always
    depends_on:
      - mysql
      - redis
      - rabbitmq
    command: sh -c "go mod download && go run main.go"  # 开发环境使用go run
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端服务
  frontend:
    image: node:20-alpine
    container_name: goshopadmin-frontend
    ports:
      - "5173:3000"  # Vite开发服务器端口
    volumes:
      - ../frontend:/app  # 开发环境挂载本地代码
      - frontend-build:/app/dist  # 生产环境挂载构建产物到卷
    working_dir: /app
    environment:
      - NODE_ENV=${NODE_ENV:-development}  # 默认开发环境
    networks:
      - goshopadmin-network
    restart: always
    depends_on:
      - backend
    command: sh -c "npm install && if [ \"$NODE_ENV\" = \"production\" ]; then npm run build; else npm run dev -- --host; fi"  # 根据环境变量选择命令
    healthcheck:
      test: ["CMD", "if [ \"$NODE_ENV\" = \"production\" ]; then ls -la /app/dist || exit 1; else curl -f http://localhost:3000; fi"]
      interval: 30s
      timeout: 10s
      retries: 3

  # C端商城前端服务
  shop-frontend:
    image: node:20-alpine
    container_name: goshopadmin-shop-frontend
    ports:
      - "3001:3001"  # Vite开发服务器端口
    volumes:
      - ../shop-frontend:/app  # 开发环境挂载本地代码
      - shop-frontend-build:/app/dist  # 生产环境挂载构建产物到卷
    working_dir: /app
    environment:
      - NODE_ENV=${NODE_ENV:-development}  # 默认开发环境
    networks:
      - goshopadmin-network
    restart: always
    depends_on:
      - shop-backend
    command: sh -c "npm install && if [ \"$NODE_ENV\" = \"production\" ]; then npm run build; else npm run dev -- --host; fi"  # 根据环境变量选择命令
    healthcheck:
      test: ["CMD", "if [ \"$NODE_ENV\" = \"production\" ]; then ls -la /app/dist || exit 1; else curl -f http://localhost:3001; fi"]
      interval: 30s
      timeout: 10s
      retries: 3

  # C端商城后端服务
  shop-backend:
    image: golang:1.24-alpine
    container_name: goshopadmin-shop-backend
    ports:
      - "127.0.0.1:8081:8081"  # 仅本机可访问，Prometheus 通过 Docker 内部网络访问
    volumes:
      - ../shop-backend:/app  # 开发环境挂载本地代码
      - shop-backend-logs:/app/logs  # 日志目录挂载，供 Filebeat 收集
    working_dir: /app
    environment:
      - GOPROXY=https://goproxy.cn,direct
    networks:
      - goshopadmin-network
    restart: always
    depends_on:
      - mysql
      - redis
    command: sh -c "go mod download && go run main.go"  # 开发环境使用go run
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus监控服务
  prometheus:
    image: prom/prometheus:latest
    container_name: goshopadmin-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - goshopadmin-network
    restart: always
    depends_on:
      - shop-backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana可视化服务
  grafana:
    image: grafana/grafana:latest
    container_name: goshopadmin-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - goshopadmin-network
    restart: always
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx服务
  nginx:
    image: nginx:1.20
    container_name: goshopadmin-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend-build:/usr/share/nginx/html/admin
      - shop-frontend-build:/usr/share/nginx/html/shop
    networks:
      - goshopadmin-network
    restart: ${RESTART_POLICY:-unless-stopped}  # 生产环境使用always，开发环境使用unless-stopped
    depends_on:
      - backend
      - frontend
      - shop-backend
      - shop-frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # ELK 日志与搜索服务
  # ============================================================================
  # ELK 是 Elasticsearch + Logstash + Kibana 的组合，用于日志收集和全文搜索
  # Elasticsearch: 搜索引擎，存储和索引数据
  # Logstash: 数据同步引擎，从 MySQL 同步业务数据到 ES
  # Kibana: 可视化界面，查看和搜索 ES 数据
  # Filebeat: 轻量级日志收集器，收集应用日志和容器日志
  # search-service: 搜索服务，提供搜索 API 给前端调用
  # ============================================================================

  # Elasticsearch 搜索引擎服务
  elasticsearch:
    build:
      context: ./elk/elasticsearch
      dockerfile: Dockerfile
    image: goshopadmin-elasticsearch:8.17.0
    container_name: goshopadmin-elasticsearch
    ports:
      - "9200:9200"  # REST API 端口，浏览器和客户端通过此端口访问 ES
    volumes:
      # ES 数据持久化目录，存储索引数据
      - es-data:/usr/share/elasticsearch/data
      # 索引模板目录（只读），修改模板后重启容器即可生效，无需重新构建镜像
      - ./elk/elasticsearch/templates:/usr/share/elasticsearch/templates:ro
      # 初始化脚本目录（只读），修改脚本后重启容器即可生效
      - ./elk/elasticsearch/scripts:/usr/share/elasticsearch/scripts:ro
    environment:
      # discovery.type: 单节点模式
      #   设为 single-node 表示只运行一个 ES 节点，不需要集群发现
      #   适用于开发和测试环境，生产环境应使用集群模式
      - discovery.type=single-node
      # ES_JAVA_OPTS: JVM 内存设置
      #   -Xms512m: 初始堆内存 512MB
      #   -Xmx512m: 最大堆内存 512MB
      #   生产环境建议设为物理内存的 50%，但不超过 32GB
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # xpack.security.enabled: 关闭安全认证
      #   开发环境关闭，避免需要配置用户名密码
      #   生产环境必须开启
      - xpack.security.enabled=false
      # xpack.security.enrollment.enabled: 关闭安全注册
      - xpack.security.enrollment.enabled=false
    networks:
      - goshopadmin-network
    restart: always
    # mem_limit: 容器内存限制 2GB
    #   ES 是内存密集型应用，需要足够的内存
    #   2GB 包含 JVM 堆内存（512MB）+ ES 堆外内存 + 操作系统缓存
    mem_limit: 2g
    healthcheck:
      # 检查 ES 集群健康状态，green 或 yellow 表示就绪
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # ES 启动较慢，给 60 秒初始等待时间

  # Logstash 数据同步服务
  logstash:
    image: logstash:8.17.0
    container_name: goshopadmin-logstash
    volumes:
      # Logstash 主配置文件
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      # Pipeline 配置目录，包含各业务同步的 .conf 文件
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline
      # MySQL JDBC 驱动，Logstash 需要此驱动连接 MySQL
      - ./elk/logstash/mysql-connector-j.jar:/usr/share/logstash/mysql-connector-j.jar
      # 增量同步位置记录目录，Logstash 把上次同步位置保存在此
      - logstash-last-run:/usr/share/logstash/last_run
    environment:
      # LS_JAVA_OPTS: Logstash JVM 内存设置
      #   Logstash 也基于 JVM，需要分配内存
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    networks:
      - goshopadmin-network
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy  # 等 ES 健康检查通过后再启动
      mysql:
        condition: service_healthy  # 等 MySQL 健康检查通过后再启动
    healthcheck:
      # 检查 Logstash API 是否可用
      test: ["CMD-SHELL", "curl -s http://localhost:9600/_node/pipelines | grep -q 'pipelines' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # Logstash 启动较慢，给 60 秒初始等待时间

  # Kibana 可视化界面服务
  kibana:
    image: kibana:8.17.0
    container_name: goshopadmin-kibana
    ports:
      - "5601:5601"  # Kibana Web 界面端口
    volumes:
      # Kibana 配置文件
      - ./elk/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
    networks:
      - goshopadmin-network
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy  # 等 ES 健康检查通过后再启动
    healthcheck:
      # 检查 Kibana 状态 API 是否可用
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"overall\":{\"level\":\"available\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Filebeat 日志收集服务
  filebeat:
    image: elastic/filebeat:8.17.0
    container_name: goshopadmin-filebeat
    # user: root
    #   Filebeat 需要以 root 用户运行，因为：
    #   1. 需要读取 Docker 容器日志目录（/var/lib/docker/containers）
    #   2. 需要访问 Docker socket（/var/run/docker.sock）获取容器元数据
    user: root
    volumes:
      # Filebeat 配置文件
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # backend 应用日志目录（只读）
      - backend-logs:/logs/backend:ro
      # shop-backend 应用日志目录（只读）
      - shop-backend-logs:/logs/shop-backend:ro
      # Docker 容器日志目录（只读），用于收集容器标准输出日志
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Docker socket，用于获取容器元数据（容器名称、镜像等）
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - goshopadmin-network
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy  # 等 ES 健康检查通过后再启动
    # 覆盖默认 entrypoint，先复制配置文件到可写目录修复权限问题再启动 filebeat
    # Windows 挂载的文件权限为 777 且为只读，filebeat 出于安全考虑拒绝加载
    # 需要先复制到可写目录、chmod 修复权限，再启动 filebeat
    entrypoint: ["/bin/bash", "-c", "cp /usr/share/filebeat/filebeat.yml /tmp/filebeat.yml && chmod go-w /tmp/filebeat.yml && exec /usr/bin/tini -- /usr/local/bin/docker-entrypoint -c /tmp/filebeat.yml --environment=container"]
    healthcheck:
      # 检查 Filebeat 进程是否运行
      # 使用 pgrep 检查 filebeat 进程，避免 entrypoint 干扰导致命令解析错误
      test: ["CMD-SHELL", "pgrep -x filebeat > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 搜索服务（Go 微服务）
  search-service:
    image: golang:1.25-alpine
    container_name: goshopadmin-search-service
    ports:
      - "8082:8082"  # 搜索服务 API 端口
    volumes:
      - ../search-service:/app  # 开发环境挂载本地代码
    working_dir: /app
    environment:
      - GOPROXY=https://goproxy.cn,direct
    networks:
      - goshopadmin-network
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy  # 等 ES 健康检查通过后再启动
      mysql:
        condition: service_healthy  # 等 MySQL 健康检查通过后再启动
    command: sh -c "go mod download && go run main.go"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql-data:
    driver: local
    driver_opts:
      type: none
      device: ./data/mysql
      o: bind
  redis-data:
    driver: local
    driver_opts:
      type: none
      device: ./data/redis
      o: bind
  rabbitmq-data:
    driver: local
    driver_opts:
      type: none
      device: ./data/rabbitmq
      o: bind
  frontend-build:
    driver: local
    driver_opts:
      type: none
      device: ../frontend/dist
      o: bind
  shop-frontend-build:
    driver: local
    driver_opts:
      type: none
      device: ../shop-frontend/dist
      o: bind
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      device: ./data/prometheus
      o: bind
  grafana-data:
    driver: local
    driver_opts:
      type: none
      device: ./data/grafana
      o: bind
  # ELK 相关数据卷
  es-data:
    driver: local
    driver_opts:
      type: none
      device: ./data/elasticsearch
      o: bind
  logstash-last-run:
    driver: local
    driver_opts:
      type: none
      device: ./data/logstash/last_run
      o: bind
  backend-logs:
    driver: local
    driver_opts:
      type: none
      device: ../backend/logs
      o: bind
  shop-backend-logs:
    driver: local
    driver_opts:
      type: none
      device: ../shop-backend/logs
      o: bind

networks:
  goshopadmin-network:
    driver: bridge
    name: goshopadmin-network
