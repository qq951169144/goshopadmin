# ============================================================================
# Kibana 配置文件
# ============================================================================
# Kibana 是 Elasticsearch 的可视化界面，用于查看和搜索 ES 中的数据。
# 通过浏览器访问 http://localhost:5601 即可使用 Kibana。
# ============================================================================

# ----------------------------------------------------------------------------
# 服务器配置
# ----------------------------------------------------------------------------
# server.host: Kibana 监听的地址
#   0.0.0.0 表示允许所有网络访问（Docker 容器需要这样才能从宿主机访问）
# server.port: Kibana 监听的端口号
#   5601 是 Kibana 的默认端口
# server.name: Kibana 实例名称
#   在多 Kibana 实例环境中用于区分不同实例
# ----------------------------------------------------------------------------
server.host: "0.0.0.0"
server.port: 5601
server.name: "goshopadmin-kibana"

# ----------------------------------------------------------------------------
# Elasticsearch 连接配置
# ----------------------------------------------------------------------------
# elasticsearch.hosts: Elasticsearch 的地址列表
#   在 Docker 网络中，ES 的主机名是 elasticsearch，端口 9200
#   如果有多个 ES 节点，可以列出多个地址实现负载均衡
# ----------------------------------------------------------------------------
elasticsearch.hosts: ["http://elasticsearch:9200"]

# ----------------------------------------------------------------------------
# 国际化配置
# ----------------------------------------------------------------------------
# i18n.locale: 界面语言
#   设为 "zh-CN" 使用中文界面，方便中文用户使用
#   可选值：en（英文）、zh-CN（简体中文）、zh-TW（繁体中文）等
# ----------------------------------------------------------------------------
i18n.locale: "zh-CN"

# ----------------------------------------------------------------------------
# 日志配置
# ----------------------------------------------------------------------------
# logging.root.level: 日志级别
#   info 级别记录正常运行信息和错误信息
# ----------------------------------------------------------------------------
logging.root.level: info

# ----------------------------------------------------------------------------
# 安全配置
# ----------------------------------------------------------------------------
# 在开发环境中，我们关闭了 Elasticsearch 的安全认证（xpack.security.enabled: false）
# 因此 Kibana 也不需要配置用户名密码
# 如果生产环境启用了安全认证，需要配置以下选项：
#   elasticsearch.username: "kibana_system"
#   elasticsearch.password: "your_password"
# ----------------------------------------------------------------------------
