# ============================================================================
# Logstash 主配置文件
# ============================================================================
# Logstash 是数据收集和转换引擎，它从 MySQL 读取业务数据，转换后写入 Elasticsearch。
#
# 本配置的核心概念：
# - Pipeline（管道）：一条数据处理流水线，包含 input → filter → output 三个阶段
# - 每个 Pipeline 在 pipeline/ 目录下有独立的配置文件
# - Logstash 会并行运行所有 Pipeline，互不干扰
# ============================================================================

# ----------------------------------------------------------------------------
# API 配置
# ----------------------------------------------------------------------------
# Logstash 提供了一个监控 API，可以查看 Pipeline 的运行状态
# api.http.host: 监控 API 绑定的地址，0.0.0.0 表示允许所有网络访问
# api.http.port: 监控 API 的端口号
# ----------------------------------------------------------------------------
api.http.host: "0.0.0.0"
api.http.port: 9600

# ----------------------------------------------------------------------------
# Pipeline 配置
# ----------------------------------------------------------------------------
# path.config: Pipeline 配置文件的路径，支持通配符
#   这里指向 /usr/share/logstash/pipeline/ 目录下的所有 .conf 文件
#   Logstash 启动时会加载该目录下所有的 .conf 文件作为独立的 Pipeline
#
# config.reload.automatic: 是否自动检测配置文件变更并重新加载
#   设为 true 后，修改 .conf 文件不需要重启 Logstash
#
# config.reload.interval: 检测配置文件变更的间隔时间（秒）
#   每 3 秒检查一次配置文件是否有更新
#
# pipeline.workers: Pipeline 的工作线程数
#   每个 Pipeline 使用 2 个线程并行处理数据，提高吞吐量
#
# pipeline.batch.size: 每批处理的事件数量
#   一次处理 125 个事件，减少网络请求次数，提高效率
#
# pipeline.batch.delay: 批处理的最大等待时间（毫秒）
#   如果凑不够 125 个事件，最多等 50 毫秒就开始处理，避免数据延迟
# ----------------------------------------------------------------------------
path.config: "/usr/share/logstash/pipeline/*.conf"
config.reload.automatic: true
config.reload.interval: 3s
pipeline.workers: 2
pipeline.batch.size: 125
pipeline.batch.delay: 50

# ----------------------------------------------------------------------------
# 日志配置
# ----------------------------------------------------------------------------
# log.level: 日志级别，可选值：fatal, error, warn, info, debug, trace
#   设为 info 级别，记录正常运行信息和错误信息
# ----------------------------------------------------------------------------
log.level: info

# ----------------------------------------------------------------------------
# 队列配置
# ----------------------------------------------------------------------------
# queue.type: 内部队列类型
#   memory: 数据存在内存中，速度快但 Logstash 崩溃会丢失数据
#   persisted: 数据持久化到磁盘，安全但性能稍低
#   这里选择 memory，因为数据可以从 MySQL 重新同步
# ----------------------------------------------------------------------------
queue.type: memory
