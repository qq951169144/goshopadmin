# ============================================================================
# 商品数据同步 Pipeline - products.conf
# ============================================================================
# 本 Pipeline 从 MySQL 的商品相关表中读取数据，转换后写入 Elasticsearch。
# 同步策略：每 30 秒轮询一次，基于 updated_at 字段增量同步（只同步有变化的数据）。
#
# 数据流：MySQL → Logstash → Elasticsearch
#   1. input: 从 MySQL 查询商品数据（关联 SKU、分类、商家表）
#   2. filter: 处理数据格式（如图片字段拆分为数组）
#   3. output: 写入 Elasticsearch 的 products 索引
# ============================================================================

input {
  jdbc {
    # --------------------------------------------------------------------------
    # JDBC 连接配置
    # --------------------------------------------------------------------------
    # jdbc_driver_library: MySQL JDBC 驱动文件路径
    #   Logstash 需要这个驱动才能连接 MySQL 数据库
    jdbc_driver_library => "/usr/share/logstash/mysql-connector-j.jar"

    # jdbc_driver_class: JDBC 驱动类名
    #   这是 MySQL 官方驱动的标准类名
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"

    # jdbc_connection_string: 数据库连接地址
    #   mysql:3306 是 Docker 网络中 MySQL 容器的地址
    #   useSSL=false: 开发环境关闭 SSL 加密连接
    #   characterEncoding=UTF-8: 确保中文数据正确传输
    jdbc_connection_string => "jdbc:mysql://mysql:3306/goshopadmin?useSSL=false&characterEncoding=UTF-8"

    # jdbc_user / jdbc_password: 数据库用户名和密码
    jdbc_user => "root"
    jdbc_password => "password"

    # --------------------------------------------------------------------------
    # 同步策略配置
    # --------------------------------------------------------------------------
    # schedule: 定时任务表达式（Cron 格式）
    #   "*/30 * * * * *" 表示每 30 秒执行一次
    #   格式：秒 分 时 日 月 星期
    schedule => "*/30 * * * * *"

    # statement: SQL 查询语句
    #   这是最核心的配置，定义了从 MySQL 读取哪些数据
    #   使用 sql_last_value 实现增量同步：
    #     - 首次运行时，sql_last_value 为 1970-01-01 00:00:00，会同步所有数据
    #     - 后续运行时，sql_last_value 为上次查询到的最大 updated_at 值
    #     - 因此只同步 updated_at > sql_last_value 的数据（即有变化的数据）
    statement => "
      SELECT
        p.id,
        p.name,
        p.description,
        p.detail,
        p.category_id,
        pc.name AS category_name,
        p.merchant_id,
        m.name AS merchant_name,
        p.status,
        p.audit_status,
        p.price,
        /* 聚合计算所有 SKU 的最低价 */
        IFNULL(MIN(ps.price), p.price) AS min_price,
        /* 聚合计算所有 SKU 的最高价 */
        IFNULL(MAX(ps.price), p.price) AS max_price,
        /* 聚合计算所有 SKU 的总库存 */
        IFNULL(SUM(ps.stock), 0) AS total_stock,
        p.is_activity,
        p.main_image,
        p.images,
        p.created_at,
        p.updated_at
      FROM products p
      /* 关联分类表，获取分类名称 */
      LEFT JOIN product_categories pc ON p.category_id = pc.id
      /* 关联商家表，获取商家名称 */
      LEFT JOIN merchants m ON p.merchant_id = m.id
      /* 关联 SKU 表，聚合价格和库存信息 */
      LEFT JOIN product_skus ps ON p.id = ps.product_id AND ps.deleted_at IS NULL
      WHERE p.deleted_at IS NULL
        AND p.updated_at > :sql_last_value
      GROUP BY p.id
      ORDER BY p.updated_at ASC
    "

    # use_column_value: 使用数据库列的值作为增量同步的依据
    #   设为 true 表示根据某列的值判断哪些数据是新的
    use_column_value => true

    # tracking_column: 追踪列名
    #   指定使用 updated_at 列的值来判断数据是否有更新
    tracking_column => "updated_at"

    # tracking_column_type: 追踪列的数据类型
    #   timestamp 表示时间戳类型
    tracking_column_type => "timestamp"

    # last_run_metadata_path: 记录上次同步位置的文件
    #   Logstash 会把 sql_last_value 的值保存到这个文件中
    #   重启 Logstash 后会从文件中读取上次的位置，继续增量同步
    last_run_metadata_path => "/usr/share/logstash/last_run/products_last_run"

    # clean_run: 是否清除上次同步记录
    #   设为 false 表示保留上次同步位置，实现增量同步
    #   如果设为 true，则会重新同步所有数据（首次部署或数据修复时使用）
    clean_run => false

    # tags: 给这个 input 的事件打标签
    #   后续在 filter 或 output 中可以根据标签做不同处理
    tags => ["products"]
  }

  # --------------------------------------------------------------------------
  # 商品 SKU 数据同步（单独的 JDBC input）
  # --------------------------------------------------------------------------
  # 为什么 SKU 要单独同步？因为一个商品有多个 SKU，需要作为 nested 数组存储
  # Logstash JDBC 不支持直接将多行数据聚合为 nested 数组，所以需要分两步：
  #   1. 先同步商品基本信息（上面的 input）
  #   2. 再同步 SKU 信息（这个 input），在 output 中合并到商品文档
  # --------------------------------------------------------------------------
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/mysql-connector-j.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://mysql:3306/goshopadmin?useSSL=false&characterEncoding=UTF-8"
    jdbc_user => "root"
    jdbc_password => "password"
    schedule => "*/30 * * * * *"
    statement => "
      SELECT
        ps.id,
        ps.product_id,
        ps.sku_code,
        ps.price,
        ps.original_price,
        ps.stock,
        ps.status,
        ps.is_activity,
        ps.activity_id,
        ps.updated_at
      FROM product_skus ps
      WHERE ps.deleted_at IS NULL
        AND ps.updated_at > :sql_last_value
      ORDER BY ps.updated_at ASC
    "
    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/last_run/product_skus_last_run"
    clean_run => false
    tags => ["product_skus"]
  }
}

filter {
  # --------------------------------------------------------------------------
  # 处理商品数据的 filter
  # --------------------------------------------------------------------------
  if "products" in [tags] {
    # mutate: 修改事件字段
    # split: 将字符串按分隔符拆分为数组
    #   数据库中 images 字段存储的是 "url1||url2||url3" 格式的字符串
    #   Elasticsearch 中需要存储为数组 ["url1", "url2", "url3"]
    #   按 "||" 分隔符拆分
    mutate {
      split => { "images" => "||" }
    }

    # remove_field: 删除不需要的字段
    #   @version 和 @timestamp 是 Logstash 自动添加的字段
    #   @version 没有业务意义，删除以减少存储
    #   @timestamp 保留，因为它记录了数据被 Logstash 处理的时间
    mutate {
      remove_field => ["@version"]
    }
  }

  # --------------------------------------------------------------------------
  # 处理 SKU 数据的 filter
  # --------------------------------------------------------------------------
  if "product_skus" in [tags] {
    mutate {
      remove_field => ["@version"]
    }
  }
}

output {
  # --------------------------------------------------------------------------
  # 商品数据输出到 Elasticsearch
  # --------------------------------------------------------------------------
  if "products" in [tags] {
    elasticsearch {
      # hosts: Elasticsearch 地址
      #   在 Docker 网络中，ES 的主机名是 elasticsearch
      hosts => ["http://elasticsearch:9200"]

      # index: 目标索引名称
      #   写入 products 索引
      index => "products"

      # document_id: 文档ID
      #   使用商品的 id 作为 ES 文档ID，确保同一商品不会重复创建
      #   如果商品数据更新，ES 会覆盖旧文档（upsert 效果）
      document_id => "%{id}"

      # action: 写入动作
      #   update: 更新模式，如果文档存在则更新，不存在则创建
      #   相比 index（覆盖写入），update 只更新变化的字段，效率更高
      action => "update"

      # doc_as_upsert: 文档作为 upsert
      #   设为 true 表示：如果文档不存在，则用当前数据创建新文档
      #   如果文档存在，则用当前数据更新已有字段
      #   这样无论是新商品还是已有商品更新，都能正确处理
      doc_as_upsert => true
    }
  }

  # --------------------------------------------------------------------------
  # SKU 数据输出到 Elasticsearch（合并到商品文档的 skus 字段）
  # --------------------------------------------------------------------------
  if "product_skus" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "products"
      # 使用 product_id 作为文档ID，将 SKU 数据合并到对应的商品文档中
      document_id => "%{product_id}"
      action => "update"
      doc_as_upsert => true
    }
  }

  # --------------------------------------------------------------------------
  # 调试输出（可选，生产环境可删除）
  # --------------------------------------------------------------------------
  # stdout: 将事件输出到控制台，用于调试
  # codec => rubydebug: 以 Ruby 格式打印事件内容，方便查看数据结构
  # 注意：开启调试输出会影响性能，生产环境请注释掉
  # stdout { codec => rubydebug }
}
