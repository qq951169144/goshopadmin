# ============================================================================
# 订单数据同步 Pipeline - orders.conf
# ============================================================================
# 本 Pipeline 从 MySQL 的订单相关表中读取数据，转换后写入 Elasticsearch。
# 同步策略：每 15 秒轮询一次，基于 updated_at 字段增量同步。
# 订单同步频率比商品高，因为订单状态变化频繁，需要更及时地反映到搜索中。
#
# 数据流：MySQL → Logstash → Elasticsearch
#   1. input: 从 MySQL 查询订单数据（关联客户、商家表获取冗余名称）
#   2. filter: 清理不需要的字段
#   3. output: 写入 Elasticsearch 的 orders 索引
# ============================================================================

input {
  jdbc {
    # --------------------------------------------------------------------------
    # JDBC 连接配置
    # --------------------------------------------------------------------------
    jdbc_driver_library => "/usr/share/logstash/mysql-connector-j.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://mysql:3306/goshopadmin?useSSL=false&characterEncoding=UTF-8"
    jdbc_user => "root"
    jdbc_password => "password"

    # --------------------------------------------------------------------------
    # 同步策略配置
    # --------------------------------------------------------------------------
    # schedule: 每 15 秒执行一次
    #   订单状态变化频繁（待支付→已支付→已发货→已完成），需要更频繁的同步
    schedule => "*/15 * * * * *"

    # statement: SQL 查询语句
    #   关联客户表和商家表，获取名称字段（冗余存储，避免搜索时再关联）
    #   使用 sql_last_value 实现增量同步
    statement => "
      SELECT
        o.id,
        o.order_no,
        o.customer_id,
        c.username AS customer_name,
        o.merchant_id,
        m.name AS merchant_name,
        o.activity_id,
        o.total_amount,
        o.status,
        o.payment_status,
        o.shipping_status,
        o.address_id,
        o.payment_method,
        o.paid_at,
        o.shipped_at,
        o.delivered_at,
        o.cancelled_at,
        o.created_at,
        o.updated_at
      FROM orders o
      /* 关联客户表，获取客户用户名（冗余字段，方便搜索时直接显示） */
      LEFT JOIN customers c ON o.customer_id = c.id
      /* 关联商家表，获取商家名称（冗余字段，方便按商家筛选） */
      LEFT JOIN merchants m ON o.merchant_id = m.id
      WHERE o.updated_at > :sql_last_value
      ORDER BY o.updated_at ASC
    "

    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/last_run/orders_last_run"
    clean_run => false
    tags => ["orders"]
  }

  # --------------------------------------------------------------------------
  # 订单商品明细同步
  # --------------------------------------------------------------------------
  # 订单中的商品列表（items）作为 nested 数组存储在订单文档中
  # 这里单独查询订单商品明细，在 output 中合并到订单文档
  # --------------------------------------------------------------------------
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/mysql-connector-j.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://mysql:3306/goshopadmin?useSSL=false&characterEncoding=UTF-8"
    jdbc_user => "root"
    jdbc_password => "password"
    schedule => "*/15 * * * * *"
    statement => "
      SELECT
        oi.order_id,
        oi.product_id,
        p.name AS product_name,
        oi.sku_id,
        oi.sku_attributes,
        oi.price,
        oi.quantity,
        oi.total_amount,
        oi.updated_at
      FROM order_items oi
      /* 关联商品表，获取商品名称（冗余字段） */
      LEFT JOIN products p ON oi.product_id = p.id
      WHERE oi.updated_at > :sql_last_value
      ORDER BY oi.updated_at ASC
    "
    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/last_run/order_items_last_run"
    clean_run => false
    tags => ["order_items"]
  }
}

filter {
  # --------------------------------------------------------------------------
  # 处理订单数据的 filter
  # --------------------------------------------------------------------------
  if "orders" in [tags] {
    # 删除 Logstash 自动添加的 @version 字段，减少存储
    mutate {
      remove_field => ["@version"]
    }
  }

  # --------------------------------------------------------------------------
  # 处理订单商品明细的 filter
  # --------------------------------------------------------------------------
  if "order_items" in [tags] {
    mutate {
      remove_field => ["@version"]
    }
  }
}

output {
  # --------------------------------------------------------------------------
  # 订单数据输出到 Elasticsearch
  # --------------------------------------------------------------------------
  if "orders" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "orders"
      # 使用订单 ID 作为文档ID，确保同一订单不会重复创建
      document_id => "%{id}"
      # update + doc_as_upsert: 存在则更新，不存在则创建
      action => "update"
      doc_as_upsert => true
    }
  }

  # --------------------------------------------------------------------------
  # 订单商品明细输出到 Elasticsearch（合并到订单文档的 items 字段）
  # --------------------------------------------------------------------------
  if "order_items" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "orders"
      # 使用 order_id 作为文档ID，将商品明细合并到对应的订单文档中
      document_id => "%{order_id}"
      action => "update"
      doc_as_upsert => true
    }
  }

  # 调试输出（可选，生产环境可删除）
  # stdout { codec => rubydebug }
}
