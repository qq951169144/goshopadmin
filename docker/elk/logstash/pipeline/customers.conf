# ============================================================================
# 客户数据同步 Pipeline - customers.conf
# ============================================================================
# 本 Pipeline 从 MySQL 的客户表（C端消费者）中读取数据，写入 Elasticsearch。
# 同步策略：每 60 秒轮询一次，基于 updated_at 字段增量同步。
# 客户数据变化频率低，60 秒同步一次即可满足需求。
#
# 数据流：MySQL → Logstash → Elasticsearch
#   1. input: 从 MySQL 查询客户数据
#   2. filter: 清理不需要的字段
#   3. output: 写入 Elasticsearch 的 customers 索引
#
# 注意：这里查询的是 customers 表（C端消费者），不是 users 表（后台管理员）
# ============================================================================

input {
  jdbc {
    # --------------------------------------------------------------------------
    # JDBC 连接配置
    # --------------------------------------------------------------------------
    jdbc_driver_library => "/usr/share/logstash/mysql-connector-j.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://mysql:3306/goshopadmin?useSSL=false&characterEncoding=UTF-8"
    jdbc_user => "root"
    jdbc_password => "password"

    # --------------------------------------------------------------------------
    # 同步策略配置
    # --------------------------------------------------------------------------
    # schedule: 每 60 秒执行一次
    #   客户数据变化频率低，不需要频繁同步
    schedule => "*/60 * * * * *"

    # statement: SQL 查询语句
    #   直接查询 customers 表，不需要关联其他表
    #   客户信息相对独立，没有外键关联需要冗余
    statement => "
      SELECT
        id,
        username,
        phone,
        email,
        nickname,
        status,
        avatar,
        last_login_at,
        created_at,
        updated_at
      FROM customers
      WHERE updated_at > :sql_last_value
      ORDER BY updated_at ASC
    "

    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/last_run/customers_last_run"
    clean_run => false
    tags => ["customers"]
  }
}

filter {
  # --------------------------------------------------------------------------
  # 处理客户数据的 filter
  # --------------------------------------------------------------------------
  if "customers" in [tags] {
    # 删除 Logstash 自动添加的 @version 字段
    mutate {
      remove_field => ["@version"]
    }
  }
}

output {
  # --------------------------------------------------------------------------
  # 客户数据输出到 Elasticsearch
  # --------------------------------------------------------------------------
  if "customers" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      # 写入 customers 索引（C端消费者索引）
      index => "customers"
      # 使用客户 ID 作为文档ID
      document_id => "%{id}"
      # update + doc_as_upsert: 存在则更新，不存在则创建
      action => "update"
      doc_as_upsert => true
    }
  }

  # 调试输出（可选，生产环境可删除）
  # stdout { codec => rubydebug }
}
