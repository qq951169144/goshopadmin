# ============================================================================
# 用户数据同步 Pipeline - users.conf
# ============================================================================
# 本 Pipeline 从 MySQL 的用户表（后台管理员）中读取数据，写入 Elasticsearch。
# 同步策略：每 60 秒轮询一次，基于 updated_at 字段增量同步。
# 用户数据变化频率低，60 秒同步一次即可满足需求。
#
# 数据流：MySQL → Logstash → Elasticsearch
#   1. input: 从 MySQL 查询用户数据（关联角色表获取角色名称）
#   2. filter: 清理不需要的字段
#   3. output: 写入 Elasticsearch 的 users 索引
# ============================================================================

input {
  jdbc {
    # --------------------------------------------------------------------------
    # JDBC 连接配置
    # --------------------------------------------------------------------------
    jdbc_driver_library => "/usr/share/logstash/mysql-connector-j.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://mysql:3306/goshopadmin?useSSL=false&characterEncoding=UTF-8"
    jdbc_user => "root"
    jdbc_password => "password"

    # --------------------------------------------------------------------------
    # 同步策略配置
    # --------------------------------------------------------------------------
    # schedule: 每 60 秒执行一次
    #   用户（管理员）数据变化频率低，不需要频繁同步
    schedule => "*/60 * * * * *"

    # statement: SQL 查询语句
    #   关联角色表，获取角色名称（冗余字段，方便搜索时直接显示和筛选）
    #   注意：这里查询的是 users 表（后台管理员），不是 customers 表（C端客户）
    statement => "
      SELECT
        u.id,
        u.username,
        u.email,
        u.role_id,
        r.name AS role_name,
        u.status,
        u.created_at,
        u.updated_at
      FROM users u
      /* 关联角色表，获取角色名称 */
      LEFT JOIN roles r ON u.role_id = r.id
      WHERE u.updated_at > :sql_last_value
      ORDER BY u.updated_at ASC
    "

    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/last_run/users_last_run"
    clean_run => false
    tags => ["users"]
  }
}

filter {
  # --------------------------------------------------------------------------
  # 处理用户数据的 filter
  # --------------------------------------------------------------------------
  if "users" in [tags] {
    # 删除 Logstash 自动添加的 @version 字段
    mutate {
      remove_field => ["@version"]
    }
  }
}

output {
  # --------------------------------------------------------------------------
  # 用户数据输出到 Elasticsearch
  # --------------------------------------------------------------------------
  if "users" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      # 写入 users 索引（后台管理员索引）
      index => "users"
      # 使用用户 ID 作为文档ID
      document_id => "%{id}"
      # update + doc_as_upsert: 存在则更新，不存在则创建
      action => "update"
      doc_as_upsert => true
    }
  }

  # 调试输出（可选，生产环境可删除）
  # stdout { codec => rubydebug }
}
